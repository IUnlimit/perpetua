version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  perpetua:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP API
      - "9090:9090"   # Web 管理面板
    volumes:
      - ./config:/app/config
    depends_on:
      - redis

volumes:
  redis-data:
