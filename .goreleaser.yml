project_name: perpetua

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: perpetua
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/IUnlimit/perpetua/internal/conf.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: "386"

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
